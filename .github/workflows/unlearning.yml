name: Statistical unlearning

on:
  push:
    branches: [main, formalize-statistical-unlearning]
    paths: [statistical-unlearning/**, .github/workflows/unlearning.yml]
  pull_request:
    paths: [statistical-unlearning/**, .github/workflows/unlearning.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unlearning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve and build
        working-directory: statistical-unlearning
        run: |
          lake update
          lake exe cache get
          lake build --wfail
      - name: Record resolved dependencies
        working-directory: statistical-unlearning
        run: cat lake-manifest.json
