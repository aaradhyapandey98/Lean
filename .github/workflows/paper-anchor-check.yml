name: Paper anchor inspection
on:
  push:
    branches: [paper-faithful-reader]
permissions:
  contents: read
jobs:
  anchors:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect section IDs
        run: |
          curl -fsSL --max-time 45 https://arxiv.org/html/2605.16645v1 -o /tmp/paper.html
          grep -oE 'id="[^"]+"' /tmp/paper.html | grep -E 'id="(A|S)[0-9]*(\.SS[0-9]+)?"' | sort -u
