name: Reader visual check
on:
  push:
    branches: [paper-faithful-reader]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture desktop and mobile previews
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/reader-preview
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1050 --virtual-time-budget=15000 --screenshot=/tmp/reader-preview/desktop.png "file://$GITHUB_WORKSPACE/statistical-unlearning/site/index.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=15000 --screenshot=/tmp/reader-preview/mobile.png "file://$GITHUB_WORKSPACE/statistical-unlearning/site/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-preview
          path: /tmp/reader-preview/
